version: "3.9"

services:

  db:
    image: postgres:15
    container_name: fastapi_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init/postgre:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h db -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB};"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fastapi_app
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/test_db
      PSI_OTEL_ENABLED: ${PSI_OTEL_ENABLED:-true}
      PSI_OTEL_SERVICE_NAME: ${PSI_OTEL_SERVICE_NAME:-psi-api}
      PSI_OTEL_SERVICE_VERSION: ${PSI_OTEL_SERVICE_VERSION:-0.1.0}
      PSI_OTEL_ENVIRONMENT: ${PSI_OTEL_ENVIRONMENT:-dev}
      PSI_OTEL_EXPORTER_OTLP_ENDPOINT: ${PSI_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      PSI_OTEL_EXPORTER_OTLP_INSECURE: ${PSI_OTEL_EXPORTER_OTLP_INSECURE:-true}
      PSI_OTEL_TRACES_SAMPLER_ARG: ${PSI_OTEL_TRACES_SAMPLER_ARG:-1.0}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.1
    container_name: otel_collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker-init/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "8889:8889"

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker-init/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker-init/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
