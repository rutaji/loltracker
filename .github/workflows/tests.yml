name: Tests

on:
  push:
    branches:
      - main
      - develop
      - feat/**
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+pysqlite:///./ci_test.db
      RIOT_API_KEY: test-key
      PSI_OTEL_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite
        if: github.ref_name == 'main' || github.ref_name == 'develop'
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Run unit tests only
        if: startsWith(github.ref_name, 'feat/')
        run: |
          pytest -m "not integration" --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        if: github.ref_name == 'main' || github.ref_name == 'develop'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
